# roles/coredns/defaults/main.yml
---
# ============================================================
# CoreDNS 部署配置 (docker-compose 方式)
# ============================================================

# 部署目录 (与目标节点一致)
coredns_deploy_dir: "/etc/coredns"
coredns_logs_dir: "/data/docker/coredns/logs"

# CoreDNS 镜像配置
coredns_image: "your-docker-repo.example.com:4003/coredns"
coredns_version: "1.14.1-view"

# 上游 DNS 服务器
coredns_upstream_servers:
  - 192.168.0.100
  - 192.168.0.101

# DNS 端口
coredns_dns_port: 53
coredns_health_port: 8080
coredns_metrics_port: 9153

# ============================================================
# 性能调优
# ============================================================

# 缓存配置
coredns_cache_ttl: 300                    # 正向缓存 TTL 上限 (秒)
coredns_cache_success_size: 10000         # 正向缓存最大条目数
coredns_cache_denial_size: 5000           # 负向缓存 (NXDOMAIN/NODATA) 最大条目数
coredns_cache_denial_ttl: 60              # 负向缓存 TTL (秒)，避免长时间缓存不存在的域名
coredns_cache_prefetch: 10                # 预取阈值: 1小时内查询次数 >= 此值时，TTL 到期前自动刷新
coredns_cache_serve_stale: 3600           # 上游故障时继续提供过期缓存 (秒)，0 为禁用

# EDNS UDP 缓冲区大小 (RFC 8020 推荐 1232 字节，避免 UDP 分片)
# 注意: bufsize 插件需要编译到镜像中 (plugin.cfg 已包含)，重新构建镜像后启用
coredns_bufsize_enabled: false
coredns_bufsize: 1232

# 上游转发并发控制
coredns_forward_max_concurrent: 1000      # 同时转发到上游的最大并发查询数

# 主机内核调优 (DNS 网络性能)
coredns_sysctl_tuning: true               # 是否应用内核参数调优
coredns_sysctl_rmem_max: 26214400         # UDP 接收缓冲区上限 (25MB)
coredns_sysctl_wmem_max: 26214400         # UDP 发送缓冲区上限 (25MB)
coredns_sysctl_somaxconn: 4096            # TCP 全连接队列长度 (DNS-over-TCP)
coredns_sysctl_netdev_max_backlog: 10000  # 网卡接收队列长度

# 容器文件描述符限制
coredns_ulimit_nofile: 65535              # 最大打开文件数 (每个并发连接消耗一个 fd)

# # 配置自动重载间隔,目前是通过剧本手动发布的方式实现，所以这里不配置自动
# # 例外：hosts文件会自动重载（coredns_hosts_entries中的解析域名）
# coredns_reload_interval: "10s"

# DNS 查询日志配置
# 日志输出到文件 (CoreDNS stdout 重定向到 /var/log/coredns/coredns.log)
coredns_log_to_file: true
# 日志文件名 (位于 coredns_logs_dir 目录下)
coredns_log_file: "coredns.log"
# 日志格式: {combined} 标准格式, {common} 简洁格式, 或自定义格式
# {combined} 格式包含: 客户端IP:端口 查询ID 查询类型 域名 协议 响应码 响应大小 耗时
coredns_log_format: "{combined}"

# 日志轮转配置
# 按日切割，压缩后保留 90 天
coredns_logrotate_days: 90

# ============================================================
# hosts 文件配置
# ============================================================
coredns_hosts_entries: []

# ============================================================
# 特定域名转发
# ============================================================
coredns_forward_zones: []

# ============================================================
# AD 域控 DNS 配置
# ============================================================

# 是否启用 AD 域控 DNS 集成
coredns_ad_dns_enabled: false

# AD 域控 DNS 服务器列表
coredns_ad_dns_servers: []
# 示例:
#   - "192.168.1.10"  # 主域控
#   - "192.168.1.11"  # 备域控

# AD 域名列表 (需要转发给 AD DNS 的域名)
coredns_ad_domains: []
# 示例:
#   - "company.local"       # AD 主域
#   - "subdomain.company.local"  # AD 子域

# AD 反向解析区域 (PTR 记录)
coredns_ad_reverse_zones: []
# 示例:
#   - "1.168.192.in-addr.arpa"   # 192.168.1.0/24 网段
#   - "10.in-addr.arpa"          # 10.0.0.0/8 网段

# AD DNS 转发策略
coredns_ad_dns_policy: "sequential"  # sequential 或 random

# ============================================================
# 视图配置 (View-based DNS - 智能解析)
# ============================================================
coredns_view_enabled: false
coredns_view_rules: []

# ============================================================
# 正则匹配解析 (泛域名)
# ============================================================
coredns_regex_rules: []

# ============================================================
# 内部 Zone 配置 (完整 DNS 记录支持)
# 支持: A, AAAA, CNAME, MX, TXT, SRV, NS, PTR, CAA
# ============================================================
coredns_internal_zones: []
# 示例:
#   - name: "example.com"
#     default_ttl: 3600
#     records:
#       # A 记录 - IPv4 地址
#       - { type: "A", name: "@", value: "192.168.1.10", ttl: 60 }
#       - { type: "A", name: "www", value: "192.168.1.10", ttl: 60 }
#       # AAAA 记录 - IPv6 地址
#       - { type: "AAAA", name: "@", value: "2001:db8::1", ttl: 60 }
#       # CNAME 记录 - 别名
#       - { type: "CNAME", name: "mail", value: "mx1.example.com", ttl: 1200 }
#       # MX 记录 - 邮件服务器
#       - { type: "MX", name: "@", value: "mx1.example.com", priority: 10, ttl: 3600 }
#       # TXT 记录 - SPF/DKIM/验证
#       - { type: "TXT", name: "@", value: "v=spf1 mx ~all", ttl: 1800 }
#       # SRV 记录 - 服务定位
#       - { type: "SRV", name: "_ldap._tcp", value: "ldap.example.com", port: 389, priority: 0, weight: 100, ttl: 300 }

# 各记录类型推荐 TTL 值:
#   A 记录:     60-300 秒 (快速切换)
#   AAAA 记录:  60-300 秒
#   CNAME 记录: 1200 秒 (20分钟)
#   MX 记录:    3600 秒 (1小时)
#   TXT 记录:   1800 秒 (30分钟)
#   SRV 记录:   300 秒 (5分钟)
#   NS 记录:    3600-86400 秒

# ============================================================
# 部署选项
# ============================================================

# 是否同步 Dockerfile/Makefile/plugin.cfg (用于构建镜像)
coredns_sync_build_files: false

# 配置验证
coredns_validate_config: true

# 重载方式: restart 或 reload (SIGUSR1)
coredns_reload_method: "reload"

# ============================================================
# Docker daemon.json 配置
# ============================================================
docker_daemon_config: true
docker_debug: false
docker_experimental: false
docker_iptables: false
docker_log_max_file: "7"
docker_log_max_size: "50m"
docker_registry_mirrors:
  - "https://your-docker-repo.example.com:4002"
docker_insecure_registries:
  - "your-docker-repo.example.com:4012"

# ============================================================
# Docker 安装配置
# ============================================================

# 是否安装 Docker (使用脚本安装方式)
docker_install_enabled: false

# Docker 安装配置，使用清华源
docker_install_gpg_url: "https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/ubuntu/gpg"
docker_install_repo_url: "https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/ubuntu"
docker_install_arch: "amd64"

# Docker 版本配置 (Ubuntu 22.04 Jammy)，指定版本以确保一致性
docker_install_ce_version: "5:24.0.9-1~ubuntu.22.04~jammy"
docker_install_containerd_version: "1.6.33-1"

# docker-compose 下载地址
docker_compose_download_url: "https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64"

# 代理配置 (可选)
docker_install_proxy_enabled: false
docker_install_proxy_url: "http://<your-proxy-server>:8001"

# 添加用户到 docker 组，因为本次使用ubunt 22.04 默认用户 ubuntu
docker_install_add_user: true
docker_install_user: "ubuntu"

# ============================================================
# Makefile 构建配置
# ============================================================

# 镜像仓库配置
coredns_registry: "your-docker-repo.example.com:4003"
coredns_image_name: "coredns"

# CoreDNS 和 Go 版本
coredns_build_version: "1.14.1"
coredns_go_version: "1.24"

# ============================================================
# Docker 网络模式配置
# ============================================================

# 网络模式: 默认使用 Host 模式
# 当未配置 coredns_view_rules 且 coredns_network_bridge 为 true 时, 使用 Bridge 模式
# 当配置了 coredns_view_rules 时, 强制使用 Host 模式 (view 需要获取客户端真实 IP)
coredns_network_bridge: false

# Bridge 模式下的 Docker 网络配置 (仅 coredns_network_bridge: true 时生效)
coredns_network_subnet: "192.168.100.0/24"
coredns_network_gateway: "192.168.100.1"

# 用于 Makefile init-system 配置的 DNS 服务器
coredns_system_dns_servers:
  - "192.168.0.100"
  - "192.168.0.101"
